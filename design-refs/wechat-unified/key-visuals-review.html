<title>逐月计划 · 四板块主视觉 01</title>
<style>
@font-face{font-family:Noto;src:url("../../assets/fonts/NotoSerifSC-700-sub.woff2");font-weight:700}@font-face{font-family:Geist;src:url("../../assets/fonts/GeistMono.woff2")}@font-face{font-family:Lime;src:url("../../assets/fonts/Limelight.woff2")}
*{box-sizing:border-box}body{margin:0;background:#08131d;color:#f0e6d3;font-family:Geist,"PingFang SC",monospace}main{max-width:1500px;margin:auto;padding:42px 30px 50px}.eyebrow{font:15px Lime,serif;letter-spacing:3px;color:#e8c878}h1{margin:14px 0 12px;font:700 38px/1.3 Noto,"Songti SC",serif;letter-spacing:4px}header>p{max-width:760px;color:#b8ad92;font-size:12px;line-height:1.9}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin-top:32px}figure{margin:0}img{display:block;width:100%;height:auto;background:#0c1d30}figcaption{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;padding-top:14px;border-top:1px solid #d4a84b;margin-top:12px}figcaption .no{color:#d4a84b;font-size:10px;padding-top:4px}figcaption strong{font:700 16px Noto,"Songti SC",serif;letter-spacing:2px}figcaption p{margin:6px 0 0;color:#b8ad92;font-size:10px;line-height:1.7}figcaption a{min-height:44px;display:inline-flex;align-items:center;color:#e8c878;font-size:9px;text-decoration:none;white-space:nowrap}figcaption a:focus-visible{outline:2px solid #e8c878;outline-offset:3px}footer{margin-top:36px;border-top:1px solid rgba(212,168,75,.4);padding-top:16px;color:#b8ad92;font-size:10px;line-height:1.8}
@media(max-width:1050px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:580px){main{padding:28px 20px}.gallery{grid-template-columns:1fr}h1{font-size:30px}}
</style>
</head>
<body><main>
<header><span class="eyebrow">KEY VISUALS / EXPLORATION 01</span><h1>四种心率，一套宇宙。</h1><p>成长、每日、无尽与冥想共用深空蓝、奶油纸、金色航线和印刷颗粒，但不共用同一种构图。此页是主视觉审看稿，不是游戏运行截图。</p></header>
<section class="gallery" aria-label="四张主视觉">
<figure><a href="key-growth.png"><img src="key-growth.png" width="540" height="860" alt="成长航程：循光启程，地球沿四个任务节点追向月亮"></a><figcaption><span class="no">01</span><div><strong>成长 / 循光启程</strong><p>任务环、四个节点与地月归途。强调有方向的成长。</p></div><a href="key-growth.svg">SVG 源稿</a></figcaption></figure>
<figure><a href="key-daily.png"><img src="key-daily.png" width="540" height="860" alt="每日航线：漫画三格分别呈现地月远景、岩石特写与黑洞特写，底部是150秒大读数"></a><figcaption><span class="no">02</span><div><strong>每日 / 今日航线</strong><p>漫画三格与大时长。每天一张明确的航行海报。</p></div><a href="key-daily.svg">SVG 源稿</a></figcaption></figure>
<figure><a href="key-endless.png"><img src="key-endless.png" width="540" height="860" alt="无尽追寻：暗月位于远处，地球沿近大远小的纵深航道前进"></a><figcaption><span class="no">03</span><div><strong>无尽 / 无尽追寻</strong><p>远景暗月与近大远小的航道。紧张感来自纵深，而不是巨大天体。</p></div><a href="key-endless.svg">SVG 源稿</a></figcaption></figure>
<figure><a href="key-meditation.png"><img src="key-meditation.png" width="540" height="860" alt="星空冥想：圆形观测窗中包含月亮、地球、星座和层叠轨道带"></a><figcaption><span class="no">04</span><div><strong>冥想 / 安静轨道</strong><p>观测窗、星座与层叠轨道带。安静，但不空。</p></div><a href="key-meditation.svg">SVG 源稿</a></figcaption></figure>
</section>
<footer>可编辑源稿为同目录四张 SVG，PNG 为 Chrome 实际渲染结果。每日日期为版式样例；无尽与冥想玩法尚未实现。本组素材尚未进入微信运行包，后续需根据审看结果决定动态拆分与资源压缩。</footer>
</main></body></html>
